name: Build WASEEM SMS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
          test -n "$ZIP"

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          if [ -f extracted/settings.gradle ]; then
            ROOT=extracted
          else
            ROOT=$(find extracted -maxdepth 3 -name settings.gradle -printf '%h\n' | head -1)
          fi

          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$ROOT"
          gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" WASEEM-SMS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-SMS-APK
          path: WASEEM-SMS.apk
          if-no-files-found: error
